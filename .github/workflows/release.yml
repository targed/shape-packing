name: Release Standalone Worker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TARGET_DIR: target
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows binary
        run: cargo build --bin shape-packing-worker --release --no-default-features --manifest-path packer_rs/Cargo.toml

      - name: Create Package Readme
        shell: pwsh
        run: |
          @"
          Distributed Shape Packing Volunteer Worker
          ===========================================
          Thank you for contributing compute to distributed shape packing research!

          Quick Start:
          1. Double-click shape-packing-worker.exe or run it from PowerShell/CMD.
          2. Follow the one-time interactive prompt (server URL, username, CPU cores).
          3. The worker will automatically lease packing tasks, compute solutions,
             and submit candidate records to the coordinator.

          Autostart on boot (zero admin elevation required):
            shape-packing-worker.exe autostart enable
            shape-packing-worker.exe autostart disable
            shape-packing-worker.exe autostart status

          Options & flags:
            shape-packing-worker.exe --help
          "@ | Out-File -FilePath target/release/README.txt -Encoding utf8

      - name: Package Windows Archive
        shell: pwsh
        run: Compress-Archive -Path target/release/shape-packing-worker.exe, target/release/README.txt -DestinationPath shape-packing-worker-windows-x86_64.zip -Force

      - name: Upload Windows Archive
        uses: actions/upload-artifact@v4
        with:
          name: shape-packing-worker-windows-x86_64
          path: shape-packing-worker-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux binary
        run: cargo build --bin shape-packing-worker --release --no-default-features --manifest-path packer_rs/Cargo.toml

      - name: Strip Linux binary
        run: strip target/release/shape-packing-worker

      - name: Create Package Readme
        run: |
          cat << 'EOF' > target/release/README.txt
          Distributed Shape Packing Volunteer Worker
          ===========================================
          Thank you for contributing compute to distributed shape packing research!

          Quick Start:
          1. Run ./shape-packing-worker from terminal.
          2. Follow the one-time interactive prompt (server URL, username, CPU cores).
          3. The worker will automatically lease packing tasks, compute solutions,
             and submit candidate records to the coordinator.

          Autostart on login:
            ./shape-packing-worker autostart enable
            ./shape-packing-worker autostart disable
            ./shape-packing-worker autostart status

          Options & flags:
            ./shape-packing-worker --help
          EOF

      - name: Package Linux Archive
        run: tar -czvf shape-packing-worker-linux-x86_64.tar.gz -C target/release shape-packing-worker README.txt

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v4
        with:
          name: shape-packing-worker-linux-x86_64
          path: shape-packing-worker-linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build macOS binaries (x86_64 & aarch64)
        run: |
          cargo build --bin shape-packing-worker --release --no-default-features --manifest-path packer_rs/Cargo.toml --target x86_64-apple-darwin
          cargo build --bin shape-packing-worker --release --no-default-features --manifest-path packer_rs/Cargo.toml --target aarch64-apple-darwin

      - name: Create Universal Binary & Strip
        run: |
          lipo -create -output shape-packing-worker \
            target/x86_64-apple-darwin/release/shape-packing-worker \
            target/aarch64-apple-darwin/release/shape-packing-worker
          strip shape-packing-worker

      - name: Create Package Readme
        run: |
          cat << 'EOF' > README.txt
          Distributed Shape Packing Volunteer Worker
          ===========================================
          Thank you for contributing compute to distributed shape packing research!

          Quick Start:
          1. Run ./shape-packing-worker from terminal.
          2. Follow the one-time interactive prompt (server URL, username, CPU cores).
          3. The worker will automatically lease packing tasks, compute solutions,
             and submit candidate records to the coordinator.

          Autostart on login:
            ./shape-packing-worker autostart enable
            ./shape-packing-worker autostart disable
            ./shape-packing-worker autostart status

          Options & flags:
            ./shape-packing-worker --help
          EOF

      - name: Package macOS Archive
        run: tar -czvf shape-packing-worker-macos-universal.tar.gz shape-packing-worker README.txt

      - name: Upload macOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: shape-packing-worker-macos-universal
          path: shape-packing-worker-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum shape-packing-worker-windows-x86_64.zip \
                    shape-packing-worker-linux-x86_64.tar.gz \
                    shape-packing-worker-macos-universal.tar.gz > checksums.sha256
          cat checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-assets/shape-packing-worker-windows-x86_64.zip
            release-assets/shape-packing-worker-linux-x86_64.tar.gz
            release-assets/shape-packing-worker-macos-universal.tar.gz
            release-assets/checksums.sha256
