name: Sync Azure Coordinator DB to Git

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Consistent SQLite Snapshot from Azure
        run: |
          curl -fSL "https://shape-packing.azurewebsites.net/api/v1/export/db" -o shape_packing.db.tmp
          python3 -c "import sqlite3; c = sqlite3.connect('shape_packing.db.tmp'); assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; print('Problems:', c.execute('SELECT COUNT(*) FROM problems').fetchone()[0], 'Solutions:', c.execute('SELECT COUNT(*) FROM solutions').fetchone()[0])"
          mv shape_packing.db.tmp shape_packing.db

      - name: Commit Updated DB Backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet shape_packing.db; then
            echo "No DB changes since last backup."
          else
            git add shape_packing.db
            git commit -m "chore(db): sync live coordinator snapshot"
            git push
          fi
