name: Sync Azure Coordinator DB to Git

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Consistent SQLite Snapshot from Azure
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "${BACKUP_TOKEN}" ]; then
            echo "ERROR: BACKUP_TOKEN secret is not configured." >&2
            exit 1
          fi
          curl -fS --max-time 60 --max-filesize 52428800 \
            -H "Authorization: Bearer ${BACKUP_TOKEN}" \
            "https://shape-packing-ggd4d5e8c2ctggam.eastus-01.azurewebsites.net/api/v1/export/db" \
            -o shape_packing.db.tmp
          python3 -c "import sqlite3; c = sqlite3.connect('shape_packing.db.tmp'); assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; tables = {r[0] for r in c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()}; assert {'problems', 'solutions', 'workers'}.issubset(tables); p_cnt = c.execute('SELECT COUNT(*) FROM problems').fetchone()[0]; assert p_cnt >= 2000; print('Problems:', p_cnt, 'Solutions:', c.execute('SELECT COUNT(*) FROM solutions').fetchone()[0])"
          mv shape_packing.db.tmp shape_packing.db

      - name: Commit Updated DB Backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet shape_packing.db; then
            echo "No DB changes since last backup."
          else
            git add shape_packing.db
            git commit -m "chore(db): sync live coordinator snapshot"
            git push
          fi
