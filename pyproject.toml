[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shape_packing"
version = "0.1.0"
description = "Autonomous 2D shape packing research loop (no ML)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]