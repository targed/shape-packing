[package]
name = "packer_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "packer_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "packer_rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1